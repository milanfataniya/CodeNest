{% extends "index.html" %}
{% block content %}
<title>CodeNest AI Chatbot</title>

<style>
.ai-chat-page {
    background-color: #0f172a;
    font-family: 'Poppins', sans-serif;
    color: #f1f5f9;
    min-height: 90vh;
    padding: 10px 0;
    transition: background-color 0.6s ease;
}

/* Main container */
.ai-chat-page .container {
    width: 60%;
    max-width: 700px;
    margin-bottom: 60px;
    background: #1e293b;
    border-radius: 12px;
    padding: 40px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    border: 1px solid #334155;
    transition: all 0.5s ease;
}

/* Hover animation */
.ai-chat-page .container:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(16,185,129,0.3);
    border-color: #10b981;
}

/* Heading */
.ai-chat-page h2 {
    color: #10b981;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
}

.ai-chat-page h2 i {
    color: #10b981;
    margin-right: 10px;
}

/* Chat history box */
.chat-history {
    background: #0f172a;
    border-radius: 10px;
    padding: 15px;
    height: 320px;
    overflow-y: auto;
    margin-bottom: 20px;
    border: 1px solid #334155;
    white-space: pre-wrap;
    scrollbar-width: thin;
    scrollbar-color: #10b981 #1e1e1e;
}

/* Messages */
.message {
    margin-bottom: 3px;
    line-height: 1.2;
}

.user {
    color: #38bdf8;
    font-weight: 600;
}

.ai {
    color: #10b981;
    font-weight: 600;
}

/* Chat input row like ChatGPT */
.chat-input {
    display: flex;
    align-items: center;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 6px;
    box-shadow: inset 0 0 10px rgba(16,185,129,0.1);
}

.chat-input textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: #f8fafc;
    font-size: 15px;
    resize: none;
    height: 50px;
    padding: 10px;
    outline: none;
}

.chat-input button {
    background: #10b981;
    border: none;
    color: #0f172a;
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 600;
    margin-left: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
}

.chat-input button:hover {
    background: #059669;
    color: #ffffff;
}
.spinner {
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top: 3px solid #0f172a;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    display: inline-block;
    margin-right: 8px;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
/* Responsive */
@media (max-width: 768px) {
    .ai-chat-page .container {
        width: 90%;
        padding: 25px;
    }

    .chat-history {
        height: 250px;
    }

    .chat-input textarea {
        font-size: 14px;
        height: 45px;
    }

    .chat-input button {
        padding: 8px 12px;
        font-size: 14px;
    }
}
</style>

<div class="ai-chat-page">
    <div class="container">
        <h2><i class="fas fa-comments"></i> CodeNest AI Chatbot</h2>

        <div class="chat-history" id="chatHistory">
            {% if response %}
            <div class="message">
                <span class="user">You:</span> {{ user_prompt }}
            </div>
            <div class="message" >
                <span class="ai">CodeNest AI:</span> {{ response }}
            </div>
            {% endif %}
        </div>

        <form method="POST" class="chat-input" onsubmit="showLoading()">
            <textarea name="prompt" placeholder="Ask about CodeNest..." id="chatInput"></textarea>
            <button type="submit" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>
<script>
    function showLoading() {
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Thinking...';
}
const textarea = document.getElementById('chatInput');
const button = document.getElementById('sendBtn');


button.disabled = true;
button.style.opacity = "0";
button.style.cursor = "not-allowed";


textarea.oninput = function() {
    if (textarea.value.trim() !== "") {
        button.disabled = false;
        button.style.opacity = "1";
        button.style.cursor = "pointer";
    } else {
        button.disabled = true;
        button.style.opacity = "0";
        button.style.cursor = "not-allowed";
    }
};
</script>


{% endblock %}
