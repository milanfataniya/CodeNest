{% extends "index.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeNest IDE</title>

  <!-- Load Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs/loader.min.js"></script>

  <!--icon link-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f172a;
      font-family: 'Poppins', sans-serif;
      color: #f1f5f9;
    }

    /* Header (IDE Top Bar) */
    .top {
      background: #111827;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      padding: 8px 15px;
      border-bottom: 1px solid #1e293b;
    }

    .top-title {
      font-weight: bold;
      font-size: 1.2rem;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Button container on right */
    .top-actions {
      margin-left: auto; /* pushes buttons to right */
      display: flex;
      gap: 8px;
    }

    .top button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    #runBtn {
      background: #10b981;
      color: #fff;
    }
    #runBtn:hover { background: #059669; }

    #clearBtn {
      background: #ef4444;
      color: #fff;
    }
    #clearBtn:hover { background: #b91c1c; }

    /* Layout: Editor + Output */
    .main {
      flex: 1;
      display: flex;
    }

    .panel {
      width: 100%;
      height: 91%;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #1e293b;
    }

    .label {
      background: #1e293b;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 500;
      color: #10b981;
    }

    #editor, #output { flex: 1; }

    #output {
      background: white;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      color: black;
    }
    .top button i {
  margin-right: 6px;
  font-size: 1rem;
  vertical-align: middle;
}

/* Buttons (Save + Open) with modern design) */
#saveBtn {
  background: #2563eb;   /* blue tone for save */
  color: #fff;

}
#saveBtn:hover {
  background: #1d4ed8;

}

#openBtn {
  background: #9333ea;   /* purple tone for open */
  color: #fff;
 
}
#openBtn:hover {
  background: #7e22ce;

}

    /* Status Bar */
    .status {
      background: #1e293b;
      color: #9ca3af;
      font-size: 12px;
      padding: 4px 10px;
      border-top: 1px solid #334155;
    }
  </style>
</head>
<body>


  <!-- IDE Top Bar -->
   
  <div class="top">
    <div class="top-title"> Python IDE</div>
<div class="top-actions">
  <button form="form" id="runBtn" title="Run Code">
    <i class="bi bi-play-fill"></i> Run
  </button>

  <button type="button" id="clearBtn" title="Clear Editor">
    <i class="bi bi-trash-fill"></i> Clear
  </button>

  <button type="button" id="saveBtn" title="Save Python File">
    <i class="bi bi-save-fill"></i> Save As
  </button>

  <button type="button" id="openBtn" title="Open .py File">
    <i class="bi bi-folder2-open"></i> Open
  </button>
</div>


  </div>

  <!-- Main Section -->
  <form method="post" id="form" class="main">
    <div class="panel">
      <div class="label">Editor</div>
      <div id="editor"></div>
    </div>

    <div class="panel">
      <div class="label">Output</div>
      <div id="output">{% if output %}{{ output }}{% endif %}</div>
    </div>

    <input type="hidden" name="code" id="hiddenCode">
  </form>

  <div class="status">Python 3 | Flask Running | CodeNest IDE</div>

  <!-- Monaco Setup -->
  <script>
    require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs" } });

    require(["vs/editor/editor.main"], () => {
      window.editor = monaco.editor.create(document.getElementById("editor"), {
        value: `{{ code | safe }}`,
        language: "python",
        theme: "vs-dark",
        automaticLayout: true,
        minimap: { enabled: false }
      });
    });

    document.getElementById("form").onsubmit = () => {
      document.getElementById("hiddenCode").value = editor.getValue();
    };

    document.getElementById("clearBtn").onclick = () => {
      editor.setValue("");
      document.getElementById("output").innerText = "";
    };

    // Save As — open file picker and let user choose where to save the code
document.getElementById("saveBtn").onclick = async () => {
  const code = editor.getValue();

  try {
    // Use the new File System Access API
    const handle = await window.showSaveFilePicker({
      suggestedName: "my_program.py",
      types: [
        {
          description: "Python Files",
          accept: { "text/x-python": [".py"] },
        },
      ],
    });

    const writable = await handle.createWritable();
    await writable.write(code);
    await writable.close();

    alert(" Program saved successfully!");
  } catch (err) {
    console.error(err);
    alert(" Save canceled or not supported by this browser.");
  }
};
 document.getElementById("openBtn").onclick = async () => {
        try {
            // ફાઇલ પિકર ખોલો (માત્ર .py ફાઇલ માટે)
            const [fileHandle] = await window.showOpenFilePicker({
                types: [
                    {
                        description: "Python Files",
                        accept: { "text/x-python": [".py"] },
                    },
                ],
                excludeAcceptAllOption: true, // Only show .py
                multiple: false, // Only one file
            });

            // પસંદ કરેલી ફાઇલ વાંચો
            const file = await fileHandle.getFile();
            const content = await file.text();

            // એડિટરમાં મૂકો
            editor.setValue(content);

            alert(` File "${file.name}" opened successfully!`);
        } catch (error) {
            console.log(error);
            alert(" File open canceled or not supported by this browser.");
        }
    };
  </script>
</body>
</html>
{% endblock %}
