      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Register | CodeNest</title>

      <!-- Bootstrap Icons -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

      <style>
      /* RESET */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      /* BODY */
      body {
        background-color: #1e293b;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* MAIN CONTAINER */
      .container {
        background-color: #1e293b;
        border-radius: 15px;
        display: flex;
        overflow: hidden;
        width: 850px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }

      /* LEFT SECTION */
      .left {
        flex: 1;
        background-color: #0f172a;
        border-top-right-radius: 100px;
        border-bottom-right-radius: 100px;
      
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 50px;
      }

      .left h2 {
        font-size: 1.8rem;
        margin-bottom: 15px;
        font-weight: 600;
      }

      .left p {
        color: #cbd5e1;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 25px;
        max-width: 300px;
      }

      .left button {
        background: transparent;
        border: 1px solid #38bdf8;
        color: #38bdf8;
        border-radius: 25px;
        padding: 10px 30px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .left button:hover {
        background-color: #38bdf8;
        color: #0f172a;
      }
      /* Floating Animation */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
      }

      .left img {
        max-width: 200px;
        height: auto;
        animation: float 3s ease-in-out infinite;
      }

      /* RIGHT SECTION */
      .right {
        flex: 1.1;
        padding: 60px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .right h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 25px;
        text-align: center;
      }

      /* FORM */
      form {
        display: flex;
        flex-direction: column;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        margin: 10px 0;
        border: none;
        border-radius: 6px;
        background-color: #0f172a;
        color: #fff;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.3s ease;
      }

      input:focus {
        box-shadow: 0 0 0 1px #38bdf8;
      }

      /* PASSWORD TOGGLE */
      .password-wrapper {
        position: relative;
      }

      .password-wrapper .toggle-eye {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #38bdf8;
        cursor: pointer;
      }

      /* SIGN UP BUTTON */
      button[type="submit"] {
        background-color: #38bdf8;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 12px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s ease;
        margin-top: 15px;
      }

      button[type="submit"]:hover {
        background-color: #0ea5e9;
      }

      /* LOGIN LINK */
      a {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #38bdf8;
        font-size: 0.9rem;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 850px) {
        .container {
          flex-direction: column;
          border-radius: 20px;
        }
        .left {
          border-radius: 0;
          border-top-left-radius: 100px;
          border-top-right-radius: 100px;
          padding: 40px 20px;
        }
        .right {
          padding: 40px 30px;
        }
      }
      </style>
      </head>

      <body>
        <div class="container">
          <!-- LEFT -->
          <div class="left">
        
          <img src="{{ url_for('static', filename='images/coder02.png') }}" alt="GIF Example" width="200"><br>

            <h3>Welcome to CodeNest!</h3><br>
            <p>Join our coding community and start learning, coding, and taking quizzes all in one place.</p>
            <button onclick="window.location.href='/login'">SIGN IN</button>
          </div>

          <!-- RIGHT -->
          <div class="right">
            <h2>Create Account</h2>
            
            <form action="/register" method="POST">
              <input type="text" name="nm1" placeholder="Name" required>
              <input type="email" name="nm2" placeholder="Email" required>

              <div class="password-wrapper">
                <input type="password" id="nm3" name="nm3" placeholder="Password" required  onpaste="return false;">
                <i id="eye1" class="bi bi-eye-slash toggle-eye" onclick="togglePassword('nm3', this)"></i>
              </div>

              <div class="password-wrapper">
                <input type="password" id="nm4" name="nm4" placeholder="Confirm Password" required  onpaste="return false;">
                <i id="eye2" class="bi bi-eye-slash toggle-eye" onclick="togglePassword('nm4', this)"></i>
              </div>

              <button type="submit">Sign Up</button>
              <a href="/login">Already have an account? Login</a>
            
            </form>
          </div>
        </div>

      <script>
      function togglePassword(id, eyeIcon) {
        const input = document.getElementById(id);
        if (input.type === "password") {
          input.type = "text";
          eyeIcon.classList.replace("bi-eye-slash", "bi-eye");
        } else {
          input.type = "password";
          eyeIcon.classList.replace("bi-eye", "bi-eye-slash");
        }
      }


        /*password not paste logic*/
            document.getElementById('nm3').addEventListener('paste', function(e){
                  e.preventDefault(); // pasteને અટકાવો
                  alert("Paste not allowed in password field!");
              });

             document.getElementById('nm4').addEventListener('paste', function(e){
                  e.preventDefault(); // pasteને અટકાવો
                  alert("Paste not allowed in password field!");
              });
      </script>
      </body>
      </html>
