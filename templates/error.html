<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>No Internet Connection</title>
    <style>
        body {
            background: #f8d7da;
            color: #721c24;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .error-box {
            background: #f5c6cb;
            border: 2px solid #721c24;
            border-radius: 10px;
            display: inline-block;
            padding: 30px 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #721c24;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #501015;
        }+
       
    </style>
</head>
<body>
    <div class="error-box">
            <img src="{{ url_for('static', filename='images/error01.gif') }}" alt="GIF Example" width="120">
        <h1> No Internet Connection</h1>
        <p>Please check your network and try again.</p>
        <a href="/" class="btn"> Retry</a>
    </div>
</body>
</html>
