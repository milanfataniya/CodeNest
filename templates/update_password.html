          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Update Password | CodeNest</title>
          <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Poppins", sans-serif; }

            body {
              background-color: #1e293b;
              color: #fff;
              min-height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 24px;
            }

            .container {
              width: 900px;
              max-width: 96%;
              display: flex;
              align-items: stretch; /* important: make both panels equal height */
              border-radius: 15px;
              overflow: hidden;
              box-shadow: 0 10px 30px rgba(0,0,0,0.5);
              background: linear-gradient(180deg, #0f172a 0%, #0f172a 100%);
            }

            /* LEFT PANEL: text + image (centered) */
            .image-section {
              flex: 1;
              background-color: #0f172a;
              display: flex;
              flex-direction: column;
              justify-content: center;      /* vertical centering */
              align-items: center;          /* horizontal centering */
              gap: 18px;                    /* space between h2, img, p */
              padding: 40px 28px;
              text-align: center;
          
            }

            .image-section h2 {
              font-size: 1.9rem;
              font-weight: 600;
              line-height: 1;
            }

            .image-section p {
              color: #cbd5e1;
              max-width: 320px;
              font-size: 0.95rem;
            }

        .image-section img {
          width: 100%;
          max-width: 580px;   /* increased from 520px */
          height: 240px;      /* increased from 200px */
          max-height: 1300px; /* optional, slightly larger */
          object-fit: contain;
          display: block;
        }

            /* RIGHT PANEL: form */
            .form-section {
              flex: 1;
              background-color: #1e293b;
              padding: 48px 36px;
              display: flex;
              align-items: center;        /* center form vertically */
              justify-content: center;    /* center horizontally */
            }

            /* constrain the form width so it doesn't stretch */
            .form-inner {
              width: 100%;
              max-width: 360px;
            }

            .form-inner h3 {
              margin-bottom: 8px;
              font-size: 1.15rem;
              color: #e6eef8;
            }

            form {
              display: flex;
              flex-direction: column;
              gap: 10px;
            }


            
            input[type="email"],
            input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: none;
        background-color: #0f172a; /* keep same dark background */
        color: #fff;               /* text stays white */
        outline: none;
        transition: box-shadow .18s ease;
        font-size: 0.95rem;
      }

        @media (min-width: 1000px) {
          .image-section img {
            max-width: 640px;
            height: 260px;
          }
        }

        input:focus {
          box-shadow: 0 0 0 1px #38bdf8;
        }

            .password-wrapper { position: relative; }

            .toggle-eye {
              position: absolute;
              right: 12px;
              top: 50%;
              transform: translateY(-50%);
              cursor: pointer;
              color: #38bdf8;
              font-size: 1.05rem;
            }
              @keyframes float {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-15px); }
                100% { transform: translateY(0px); }
              }

              img {
                max-width: 200px;
                height: auto;
                animation: float 3s ease-in-out infinite;
              }
                  button {
              padding: 12px;
              border-radius: 8px;
              border: none;
              background-color: #38bdf8;
              color: white;
              font-weight: 600;
              cursor: pointer;
              margin-top: 6px;
            }
            button:hover { background: #0ea5e9; }

            .back-link { display: block; text-align: center; margin-top: 12px; color: #38bdf8; text-decoration: none; font-size: 0.95rem; }
            .back-link:hover { text-decoration: underline; }

            @media (max-width: 820px) {
              .container { flex-direction: column; border-radius: 12px; }
              .image-section { border-radius: 12px 12px 0 0; border-top-right-radius: 12px; border-bottom-right-radius: 0; padding: 28px 18px; gap: 12px; }
              .form-section { padding: 28px 18px; }
              .image-section p { max-width: 90%; }
              .image-section img { max-height: 160px; max-width: 220px; }
            }
          </style>
          </head>
          <body>

          <div class="container">
            <!-- LEFT PANEL: text above image (centered) -->
            <div class="image-section">
              <h2>Forgot Password ?</h2>
              <img src="{{ url_for('static', filename='images/forgot.png') }}" alt="Forgot password illustration">
              <p>No worries! Enter your email and your new password below to reset your account. Make sure your new password is strong and secure.</p>
            </div>

            <!-- RIGHT PANEL: form -->
            <div class="form-section">
              <div class="form-inner">
                <h3>Update your password</h3><br>
                <form action="/forgot-password" method="POST">
                  <input type="email" name="email" placeholder="Enter your email" required>

                  <div class="password-wrapper">
                    <input type="password" id="new_password" name="new_password" placeholder="New Password" required onpaste="return false">
                    <i class="bi bi-eye-slash toggle-eye" onclick="togglePassword('new_password', this)"></i>
                  </div>

                  <div class="password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required onpaste="return false">
                    <i class="bi bi-eye-slash toggle-eye" onclick="togglePassword('confirm_password', this)"></i>
                  </div>

                  <button type="submit">Update Password</button>
                </form>

                <a class="back-link" href="/login">Back to Login</a>
              </div>
            </div>
          </div>

          <script>
          function togglePassword(id, eyeIcon) {
            const input = document.getElementById(id);
            if (!input) return;
            if (input.type === "password") {
              input.type = "text";
              eyeIcon.classList.replace("bi-eye-slash", "bi-eye");
            } else {
              input.type = "password";
              eyeIcon.classList.replace("bi-eye", "bi-eye-slash");
            }
          }
          /*password not paste logic*/
            document.getElementById('new_password').addEventListener('paste', function(e){
                  e.preventDefault(); // pasteને અટકાવો
                  alert("Paste not allowed in password field!");
              });

             document.getElementById('confirm_password').addEventListener('paste', function(e){
                  e.preventDefault(); // pasteને અટકાવો
                  alert("Paste not allowed in password field!");
              });
          </script>

          </body>
          </html>
